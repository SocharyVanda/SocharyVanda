name: Update activity graph

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/activity-graph.yml"
      - ".github/scripts/activity-graph.mjs"

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build graph
        run: node .github/scripts/activity-graph.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GRAPH_TITLE: "Chary's Contribution Graph"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAPH_TOKEN: ${{ secrets.GRAPH_TOKEN }}   # optional, see README notes

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          git diff --cached --quiet || (git commit -m "Update activity graph" && git push)

name: Generate contribution snake

on:
  schedule:
    - cron: "41 */12 * * *"   # twice a day
  workflow_dispatch:           # run by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/github-snake.svg?color_snake=purple
            assets/snake/github-snake-dark.svg?palette=github-dark&color_snake=purple

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/snake
          git diff --cached --quiet || (git commit -m "Update contribution snake" && git pull --rebase && git push)
